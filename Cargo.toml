[package]
name = "safe-git"
version = "0.1.0"
edition = "2024"
description = "A Git client that treats repositories as untrusted data"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
hex = "0.4"
rustix = { version = "1", features = ["fs"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
sha1-checked = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
diffy = "0.4"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
libtest-mimic = "0.8"
rustix = { version = "1", features = ["process"] }
shlex = "2"

[[test]]
name = "integration"
# The test executable also implements sshd's forced-command fixture.
harness = false

[profile.release]
overflow-checks = true
strip = true

[lints.rust]
unsafe_code = "forbid"
